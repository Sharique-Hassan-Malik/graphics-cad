[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geokit"
version = "1.0.0"
description = "Seven geometry generators, one mesh type, one way into Blender"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
geo = "geokit.cli:main"

[tool.setuptools.packages.find]
include = ["geokit*"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
# importlib import mode: several modules ship their own `tests` package, and
# the default prepend mode resolves them all to one top-level name, so
# collecting them in a single run collides.
addopts = "-q --import-mode=importlib"
